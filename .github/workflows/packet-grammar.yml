name: Packet Grammar

on:
  push:
    paths:
      - 'spec/**'
      - 'tests/packet_grammar/**'
      - '.github/workflows/packet-grammar.yml'
  pull_request:
    paths:
      - 'spec/**'
      - 'tests/packet_grammar/**'
      - '.github/workflows/packet-grammar.yml'

jobs:
  validate-packet-grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/packet_grammar/validate_scribe_compiler_capsule.py
      - run: python3 tests/packet_grammar/validate_four_bit_crossing_code.py
      - run: python3 tests/packet_grammar/validate_four_bit_crossing_harness_negatives.py
      - run: python3 tests/packet_grammar/validate_gate_evidence.py
      - run: python3 tests/packet_grammar/validate_receipt_binding.py
